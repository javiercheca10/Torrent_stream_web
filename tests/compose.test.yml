services:
  test-seeder:
    build:
      context: .
      dockerfile: tests/seeder.Dockerfile
    profiles: [test]
    user: "1000:1000"
    mem_limit: 512m
    cpus: 1.5
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: ["/data:size=192m,mode=1777", "/tmp:size=16m,mode=1777"]
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 40
