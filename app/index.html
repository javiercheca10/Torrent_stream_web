<!doctype html>
<html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cine en casa</title>
<style>
:root{color-scheme:dark;font-family:ui-rounded,"SF Pro Rounded",system-ui,sans-serif;background:#121c28;color:#f6f0e5}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 78% 0,#30465a 0,transparent 31rem),radial-gradient(circle at 5% 90%,#573f2a 0,transparent 26rem),#121c28}.shell{max-width:980px;margin:auto;padding:clamp(24px,5vw,64px) 20px 56px}.masthead{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;border-bottom:1px solid #ffffff1d;padding-bottom:30px}.eyebrow{margin:0 0 12px;color:#dcc18c;font-size:.72rem;font-weight:750;letter-spacing:.18em;text-transform:uppercase}.brand{margin:0;font-family:Georgia,serif;font-size:clamp(2.7rem,8vw,5.5rem);font-weight:400;letter-spacing:-.06em;line-height:.88}.brand span{display:block;color:#d8b66e;font-size:.36em;font-family:ui-rounded,system-ui;letter-spacing:.16em;text-transform:uppercase;margin:13px 0 0 5px}.pulse{display:flex;align-items:center;gap:8px;border:1px solid #ffffff20;border-radius:99px;padding:9px 12px;color:#dce5e5;font-size:.8rem;white-space:nowrap}.dot{width:8px;height:8px;border-radius:50%;background:#70c69b;box-shadow:0 0 0 5px #70c69b20}.intro{max-width:610px;margin:30px 0 34px;color:#c8d0d5;font-size:clamp(1rem,2vw,1.15rem);line-height:1.65}.intro strong{color:#f6f0e5;font-weight:650}.session-grid{display:grid;gap:14px}.session{position:relative;overflow:hidden;border:1px solid #ffffff18;border-radius:18px;background:linear-gradient(115deg,#ffffff12,#ffffff06);padding:22px;box-shadow:0 15px 50px #00000021}.session::after{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:#d8b66e}.session.paused::after{background:#d17f5d}.session-top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.title{margin:0;overflow-wrap:anywhere;font-family:Georgia,serif;font-size:clamp(1.35rem,4vw,1.8rem);font-weight:400;line-height:1.15}.state{margin:2px 0 0;color:#aebbc3;font-size:.85rem}.badge{flex:0 0 auto;border-radius:99px;padding:6px 10px;background:#d17f5d24;color:#ffd3bc;font-size:.71rem;font-weight:750;letter-spacing:.08em}.meter{margin:24px 0 10px;height:8px;overflow:hidden;border-radius:20px;background:#0b121b}.meter span{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#d8b66e,#f1d797);transition:width .45s ease}.session.paused .meter span{background:#d17f5d}.meta{display:flex;justify-content:space-between;gap:14px;color:#c8d0d5;font-size:.85rem}.meta b{color:#f6f0e5;font-weight:650}.empty{border:1px dashed #ffffff2c;border-radius:18px;padding:34px 22px;text-align:center;color:#b9c5cb}.empty strong{display:block;margin-bottom:7px;color:#f6f0e5;font-family:Georgia,serif;font-size:1.45rem;font-weight:400}.footer{display:flex;justify-content:space-between;gap:12px;margin-top:27px;color:#8e9ba5;font-size:.78rem}.error{margin:0 0 16px;color:#ffc4b0}@media(max-width:560px){.masthead{display:block}.pulse{display:inline-flex;margin-top:24px}.meta,.footer{display:block}.meta span{display:block;margin-top:6px}.footer p{margin:7px 0}.session{padding:20px}}
</style>
<main class="shell">
  <header class="masthead"><div><p class="eyebrow">Sala privada en red local</p><h1 class="brand">Cine en casa<span>en familia</span></h1></div><div class="pulse"><i class="dot"></i><span id="service">Comprobando sala</span></div></header>
  <p class="intro">Envía un archivo <strong>.torrent</strong> al bot de Telegram. Aquí solo puedes consultar cómo va la sesión: la sala se mantiene limpia, sencilla y lista para la tele.</p>
  <p class="error" id="error" role="alert"></p><section class="session-grid" id="sessions" aria-live="polite"></section>
  <footer class="footer"><p>Las sesiones se eliminan automáticamente al terminar.</p><p id="updated">Actualizando...</p></footer>
</main>
<script>
const $=id=>document.getElementById(id);const fmt=n=>n<1024*1024?(n/1024).toFixed(0)+' KiB':n<1024**3?(n/1024**2).toFixed(1)+' MiB':(n/1024**3).toFixed(2)+' GiB';
function node(tag,classes,text){const e=document.createElement(tag);if(classes)e.className=classes;if(text)e.textContent=text;return e}
function stateLabel(s){if(s.paused)return 'En pausa';if(s.buffer_ready)return 'Lista para reproducir';return s.state==='metadata'?'Leyendo el archivo':'Preparando la película'}
function card(s){const article=node('article','session'+(s.paused?' paused':''));const top=node('div','session-top');const title=node('h2','title',s.title||'Preparando la película');const info=node('div');info.append(title,node('p','state',stateLabel(s)+' · '+s.active_streams+' conexión'+(s.active_streams===1?'':'es')));top.append(info);if(s.paused)top.append(node('span','badge','EN PAUSA'));article.append(top);const meter=node('div','meter');const fill=node('span');const pct=Math.min(100,(s.buffered_bytes||0)/Math.max(s.buffer_target||1,1)*100);fill.style.width=pct+'%';meter.append(fill);article.append(meter);const meta=node('div','meta');meta.append(node('span','',s.buffer_ready?'Buffer preparado':'Buffer '+pct.toFixed(0)+'%'),node('span','',fmt(s.buffered_bytes||0)+' de '+fmt(s.buffer_target||0)),node('span','', 'Hasta '+new Date(s.expires_at*1000).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})));article.append(meta);return article}
async function refresh(){try{const r=await fetch('/api/status',{cache:'no-store'});if(!r.ok)throw Error('La sala no responde ahora mismo.');const list=await r.json();$('sessions').replaceChildren();$('error').textContent='';$('service').textContent='Sala disponible';if(!list.length){const empty=node('div','empty');empty.append(node('strong','','Todo tranquilo'),node('span','','No hay ninguna sesión activa. Envía un .torrent al bot cuando quieras preparar una película.'));$('sessions').append(empty)}else list.forEach(s=>$('sessions').append(card(s)));$('updated').textContent='Actualizado a las '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}catch(e){$('service').textContent='Sala sin conexión';$('error').textContent=e.message}}refresh();setInterval(refresh,5000);
</script>
